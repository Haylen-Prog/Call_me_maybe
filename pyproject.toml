[project]
name = "function-calling-constrained-decoding"
version = "1.0.0"
description = "Translates natural language prompts into structured function calls using grammar-constrained decoding on a small (0.6B) LLM."
readme = "README.md"
requires-python = ">=3.10"
# Required by the official llm_sdk/ package (Small_LLM_Model wraps a
# Hugging Face causal LM). The mock model used by the test suite
# (tests/mock_llm_sdk/) does not need any of these, so the test suite still
# runs fine even before these are installed / without network access to the
# Hugging Face Hub.
dependencies = [
    "llm-sdk",
    "accelerate>=1.14.0",
    "mypy>=2.3.1",
    "flake8>=7.3.0",
    "numpy>=2.2.6",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.mypy]
mypy_path = ["llm_sdk"]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }
